# Monthly dependency updates as pull requests (GitHub → Insights → Dependency graph → Dependabot).
# Small updates come grouped in one PR; security fixes are opened right away by GitHub.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule: { interval: "monthly" }
    groups:
      python-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "monthly" }
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 breaks vue-tsc for now
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule: { interval: "monthly" }
