# Local development: only PostgreSQL. Django runs on the host via `make dev`.
name: kg-tours
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kgtours
      POSTGRES_USER: kgtours
      POSTGRES_PASSWORD: kgtours
    ports:
      - "5434:5432"  # 5432 and 5433 are taken on the dev machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgtours -d kgtours"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
