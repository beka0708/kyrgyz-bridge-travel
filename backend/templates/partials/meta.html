{# SEO and social preview tags; `meta` is an apps.core.seo.PageMeta built in the view. #}
<link rel="canonical" href="{{ meta.canonical }}">
<meta property="og:type" content="{{ meta.og_type }}">
<meta property="og:site_name" content="{{ site.brand_name }}">
<meta property="og:title" content="{{ meta.title }}">
<meta property="og:description" content="{{ meta.description }}">
<meta property="og:url" content="{{ meta.canonical }}">
<meta property="og:locale" content="en_US">
{% if meta.image %}
<meta property="og:image" content="{{ meta.image }}">
<meta property="og:image:width" content="{{ meta.image_size.0 }}">
<meta property="og:image:height" content="{{ meta.image_size.1 }}">
<meta name="twitter:card" content="{% if meta.large_image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:image" content="{{ meta.image }}">
{% endif %}
<meta name="twitter:title" content="{{ meta.title }}">
<meta name="twitter:description" content="{{ meta.description }}">
{{ meta.json_ld_html }}
