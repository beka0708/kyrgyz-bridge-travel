{# Round button on phones, «Message us» pill on desktop (mockup «floating messenger button»). #}
{% if site.whatsapp %}
  <a href="{{ site.whatsapp_url }}" target="_blank" rel="noopener" aria-label="Write to us on WhatsApp"
     class="btn btn-accent fixed right-4 bottom-4 z-30 size-[58px] !px-0 shadow-[0_16px_40px_rgba(0,0,0,0.45)] md:right-7 md:bottom-7 md:size-auto md:min-h-14 md:gap-2.5 md:!px-6">
    {% include "partials/icon_whatsapp.html" with size="24" %}
    <span class="hidden md:inline">Message us</span>
  </a>
{% endif %}
