{% load humanize %}
{% if stats %}
  <dl class="about-stats grid grid-cols-3 gap-3 border-t pt-5 md:gap-10 md:pt-8 {{ css }}">
    {% for stat in stats %}
      <div class="flex flex-col-reverse justify-end gap-1.5 md:gap-2" style="--i: {{ forloop.counter0 }}">
        <dt class="about-stats__label text-[12px] leading-snug font-semibold md:text-[15px]">{{ stat.label }}</dt>
        <dd class="font-display text-[clamp(22px,6.4vw,28px)] leading-none font-semibold tracking-[-0.02em] tabular-nums md:text-[56px] lg:text-[64px]"><span data-count="{{ stat.value }}">{{ stat.value|intcomma }}</span><span class="text-accent">{{ stat.suffix }}</span></dd>
      </div>
    {% endfor %}
  </dl>
{% endif %}
