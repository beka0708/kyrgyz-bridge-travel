{# Desktop: floating pill (mockup «NAV»). #}
<div class="container-page relative z-10 hidden pt-5 md:block">
  <header class="rise flex flex-wrap items-center justify-between gap-3 rounded-full border-[1.5px] border-line bg-forest py-2.5 pr-3 pl-6">
    {% include "partials/logo.html" %}
    <nav class="flex flex-wrap items-center gap-2 text-[15px] font-semibold text-mist" aria-label="Main">
      {% for link in nav_links %}
        <a class="lnk px-4 py-3" href="{{ link.href }}">{{ link.label }}</a>
      {% empty %}
        <a class="lnk px-4 py-3" href="{% url 'tours:list' %}">Tours</a>
        <a class="lnk px-4 py-3" href="{% url 'core:home' %}#why">About</a>
        <a class="lnk px-4 py-3" href="{% url 'core:home' %}#reviews">Reviews</a>
        <a class="lnk px-4 py-3" href="#contacts">Contacts</a>
      {% endfor %}
    </nav>
    <a class="btn btn-accent" href="{{ header_cta_href|default:'#contacts' }}">{{ header_cta_label|default:"Contact us" }}</a>
  </header>
</div>
