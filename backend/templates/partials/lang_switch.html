{# Language menu. The site is English; Russian is announced but not translated yet. #}
<div class="relative" x-data="{ langOpen: false }" @click.outside="langOpen = false" @keydown.escape="langOpen = false">
  <button type="button" class="flex h-10 items-center gap-1.5 rounded-full border border-current/25 px-3 text-[13px] font-bold"
          @click="langOpen = !langOpen" :aria-expanded="langOpen" aria-haspopup="true" aria-label="Language: English">
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18"/></svg>
    EN
  </button>
  <div x-show="langOpen" x-cloak x-transition.origin.top.right.duration.150ms
       class="absolute top-12 right-0 z-50 w-44 overflow-hidden rounded-2xl bg-white p-1.5 text-sm text-ink shadow-[0_16px_40px_rgb(17_32_26/0.18)]">
    <span class="flex items-center justify-between rounded-xl bg-paper px-3 py-2.5 font-bold" aria-current="true">English <span aria-hidden="true">✓</span></span>
    <span class="flex items-center justify-between px-3 py-2.5 text-ink-muted" aria-disabled="true">Русский <span class="text-xs">soon</span></span>
  </div>
</div>
