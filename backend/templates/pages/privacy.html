{% extends "base.html" %}
{% load site_tags %}
{% block content %}
<section class="container-page flex flex-col gap-4 pt-8 pb-6 md:pt-20 md:pb-10">
  <div class="eyebrow text-accent">Legal</div>
  <h1 class="font-display text-[34px] leading-[1.08] font-semibold tracking-[-0.02em] md:text-[56px]">{{ "Privacy *Policy*"|accent_title }}</h1>
</section>
<section class="container-page pb-20 md:pb-28">
  <div class="legal max-w-[760px] text-mist">{{ site.privacy_policy|simple_markdown }}</div>
  {% if site.email %}<p class="mt-10 text-mist">Contact: <a class="text-accent underline-offset-4 hover:underline" href="mailto:{{ site.email }}">{{ site.email }}</a></p>{% endif %}
</section>
{% endblock %}
