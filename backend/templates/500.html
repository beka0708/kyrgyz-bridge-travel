<!doctype html>
{# Self-contained on purpose: no database, no context processors, no built assets. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <style>
    html { background: #0e1b17; color: #f3f1ea; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
    .eyebrow { color: #f2994a; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 6vw, 52px); line-height: 1.1; margin: 12px 0 16px; letter-spacing: -.02em; }
    h1 span { color: #f2994a; }
    p { color: #a9b8b0; margin: 0 0 28px; }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 30px; border-radius: 999px;
        background: #f2994a; color: #11201a; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Error 500</div>
    <h1>Something went <span>wrong</span></h1>
    <p>We already know about it and are fixing it. Please try again in a few minutes.</p>
    <a href="/">Back to the home page</a>
  </main>
</body>
</html>
